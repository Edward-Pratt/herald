# Turns a vX.Y.Z tag into a GitHub Release: checks the tag, collects the files to publish, writes SHA256SUMS and the
# notes, and creates the release. vX.Y.Z-rc.N tags become pre-releases, which `releases/latest` (the stable channel)
# skips. Called from a project's own workflow, on its tag push; see templates/release.yml.
#
# The caller builds whatever needs building and uploads it as one artifact, named in `artifact`. With no artifact,
# the release ships a source archive of the tag (<name>-<version>.tar.gz), for projects that install from source.
name: Release

on:
  workflow_call:
    inputs:
      artifact:
        description: Name of the uploaded artifact whose files are attached. Empty ships a source archive.
        type: string
        default: ""
      name:
        description: Name for the source archive and its folder. Defaults to the repository's name.
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check the tag
        id: tag
        env:
          REF: ${{ github.ref }}
        run: |
          [[ $REF =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)$ ]] ||
            { echo "::error::Not a vX.Y.Z or vX.Y.Z-rc.N tag: $REF"; exit 1; }
          echo "tag=${REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ -n ${BASH_REMATCH[2]} ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Full history and tags, for the notes. The write token stays out of the checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Outside the checkout, which may have its own dist/ or release/ folder.
      - name: Folder for the release's files
        run: |
          echo "FILES=$RUNNER_TEMP/release-files" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/release-files"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.artifact != ''
        with:
          name: ${{ inputs.artifact }}
          path: ${{ env.FILES }}

      - name: Source archive
        if: inputs.artifact == ''
        env:
          NAME: ${{ inputs.name || github.event.repository.name }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          git archive --format=tar.gz --prefix="$NAME-$VERSION/" -o "$FILES/$NAME-$VERSION.tar.gz" "$TAG"

      - name: Checksums
        working-directory: ${{ env.FILES }}
        run: |
          [[ -n $(ls -A) ]] || { echo "::error::Nothing to publish"; exit 1; }
          [[ ! -e SHA256SUMS ]] || { echo "::error::The artifact brings its own SHA256SUMS; leave that to this workflow"; exit 1; }
          # A release holds files, not folders: tar a folder up in the build.
          [[ -z $(find . -mindepth 1 -type d) ]] || { echo "::error::The artifact has folders; publish files only"; exit 1; }
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      # The commits since the previous stable release; a release candidate lists those since the previous tag of any
      # kind, so each candidate shows what changed since the last one.
      - name: Notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          if [[ $PRERELEASE == true ]]; then pattern='v*'; else pattern='v[0-9]*.[0-9]*.[0-9]*'; fi
          prev=$(git tag -l "$pattern" --sort=-v:refname | grep -vx "$TAG" |
            { if [[ $PRERELEASE == true ]]; then cat; else grep -v -- '-'; fi; } |
            while read -r t; do git merge-base --is-ancestor "$t" "$TAG" && { echo "$t"; break; }; done || true)
          {
            if [[ -n $prev ]]; then echo "Changes since $prev:"; else echo "First release."; fi
            echo
            git log --no-merges --format='- %s' "${prev:+$prev..}$TAG"
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          flags=(--latest)
          [[ $PRERELEASE == false ]] || flags=(--prerelease --latest=false)
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${flags[@]}" "$FILES"/*
